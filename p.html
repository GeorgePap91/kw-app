<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#b40101">
<!-- 1.19 · Παρουσίαση ακινήτου για τον πελάτη. Μόνο δικά μας scripts, εικόνες μόνο από εδώ ή data:. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Παρουσίαση ακινήτου · KW Athens Center</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="p.css">
<script src="config.js" defer></script>
<script src="p.js" defer></script>
</head>
<body>

<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 19z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
</svg>

<header class="top">
  <div class="top-in">
    <img class="logo" id="logo" src="logo-kw.png" alt="Keller Williams · KW Athens Center">
    <span class="wordmark" id="wordmark" hidden><b>KW</b> Athens Center</span>
    <span class="top-code" id="top-code"></span>
  </div>
</header>

<main class="wrap" id="main" aria-busy="true">
  <div class="state" id="loading">
    <span class="spinner" aria-hidden="true"></span>
    <p>Φορτώνει η παρουσίαση…</p>
  </div>

  <div class="state closed" id="closed" hidden>
    <svg class="ico big" aria-hidden="true"><use href="#i-home"/></svg>
    <h1 id="closed-title">Η παρουσίαση δεν είναι διαθέσιμη</h1>
    <p id="closed-text"></p>
  </div>

  <article id="prop" hidden>
    <figure class="hero" id="hero">
      <button class="hero-btn" id="hero-btn" aria-label="Δείτε όλες τις φωτογραφίες"><img id="hero-img" alt=""></button>
      <span class="deal" id="deal" hidden></span>
      <button class="all-photos" id="all-photos" hidden><svg class="ico" aria-hidden="true"><use href="#i-camera"/></svg><span id="all-photos-text"></span></button>
    </figure>

    <section class="headline">
      <h1 id="title"></h1>
      <p class="where" id="where" hidden><svg class="ico" aria-hidden="true"><use href="#i-pin"/></svg><span id="where-text"></span></p>
      <p class="price" id="price"></p>
    </section>

    <section class="keyfacts" id="keyfacts"></section>

    <section class="block" id="desc-block" hidden>
      <h2>Περιγραφή</h2>
      <p class="desc" id="desc"></p>
    </section>

    <section class="block" id="facts-block" hidden>
      <h2>Χαρακτηριστικά</h2>
      <dl class="facts" id="facts"></dl>
    </section>

    <section class="block" id="photos-block" hidden>
      <h2>Φωτογραφίες <small id="photos-n"></small></h2>
      <div class="grid" id="grid"></div>
    </section>

    <section class="block" id="map-block" hidden>
      <a class="map-link" id="map-link" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="#i-pin"/></svg><span>Δείτε την περιοχή στον χάρτη</span></a>
    </section>

    <section class="agent" id="agent" aria-labelledby="agent-name">
      <p class="agent-k">Ο μεσίτης σας</p>
      <div class="agent-row">
        <span class="agent-av" id="agent-av" aria-hidden="true"></span>
        <div class="agent-who"><b id="agent-name"></b><span id="agent-office"></span></div>
      </div>
      <div class="agent-btns">
        <a class="abtn red" id="a-call"><svg class="ico" aria-hidden="true"><use href="#i-phone"/></svg><span>Κλήση</span></a>
        <a class="abtn" id="a-wa" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg><span>WhatsApp</span></a>
        <a class="abtn" id="a-mail"><svg class="ico" aria-hidden="true"><use href="#i-mail"/></svg><span>Email</span></a>
      </div>
      <p class="agent-lines" id="agent-lines"></p>
    </section>
  </article>
</main>

<footer class="foot" id="foot" hidden>
  <div class="wrap">
    <p class="foot-office" id="foot-office"></p>
    <p class="foot-small" id="foot-small"></p>
  </div>
</footer>

<div class="cta-bar" id="cta" hidden>
  <a class="cta red" id="cta-call"><svg class="ico" aria-hidden="true"><use href="#i-phone"/></svg><span>Κλήση</span></a>
  <a class="cta" id="cta-wa" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg><span>WhatsApp</span></a>
</div>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Φωτογραφίες" hidden>
  <div class="lb-top">
    <span class="lb-count" id="lb-count" aria-live="polite"></span>
    <button class="lb-btn" id="lb-close" aria-label="Κλείσιμο"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="lb-stage">
    <div class="lb-track" id="lb-track"></div>
    <button class="lb-nav prev" id="lb-prev" aria-label="Προηγούμενη"><svg class="ico" aria-hidden="true"><use href="#i-left"/></svg></button>
    <button class="lb-nav next" id="lb-next" aria-label="Επόμενη"><svg class="ico" aria-hidden="true"><use href="#i-right"/></svg></button>
  </div>
</div>

</body>
</html>
