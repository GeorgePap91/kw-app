# Τρέχει τα tests σε κάθε Pull Request και σε κάθε push.
# Αν αποτύχουν, το PR δεν πρέπει να γίνει merge.
name: CI — Tests
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'chore/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    # Η πραγματική εφαρμογή σε πραγματικό Chrome με προσομοίωση κινητού (αφή).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1.63.0
      - run: CHROME_PATH="$(which google-chrome)" npm run e2e
