<!DOCTYPE html>
<html lang="el">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --red:#c8102e; --ink:#1d1d1f; --mut:#6e6e73; --line:#e5e5ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  .mut { color: var(--mut); font-size: 15px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 18px 0; }
  .card b { display: block; font-size: 19px; margin-bottom: 4px; }
  ol { padding-left: 22px; margin: 0 0 14px; }
  li { margin-bottom: 8px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .main { background: var(--red); color: #fff; }
  .ghost { background: #f2f2f7; color: var(--ink); }
  .link { background: none; color: var(--mut); text-decoration: underline; font-weight: 400; padding: 10px; }
  button:disabled { opacity: .55; }
  .ok { color: #1a7f37; }
  .err { color: var(--red); }
  .big { font-size: 40px; line-height: 1; margin-bottom: 8px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  var CODE = '<?!= code ?>';           // μόνο 0-9a-f (καθαρίζεται στο doGet)
  var ST = <?!= state ?>;               // JSON με τα < ως \u003c (βλ. doGet)
  var el = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function resText(r) {
    if (!r) return '';
    if (r.error) return '<p class="err">' + esc(r.error) + '</p>';
    if (r.off) return '<p class="mut">Στην εφαρμογή η επιλογή δεν είναι «Αυτόματα», οπότε δεν μπήκε τίποτα.</p>';
    var parts = [];
    if (r.added) parts.push('<b>' + r.added + '</b> ' + (r.added === 1 ? 'νέα επαφή' : 'νέες επαφές'));
    if (r.updated) parts.push('<b>' + r.updated + '</b> ' + (r.updated === 1 ? 'υπήρχε ήδη και μπήκε στην ομάδα' : 'υπήρχαν ήδη και μπήκαν στην ομάδα'));
    if (r.conflicts) parts.push('<b>' + r.conflicts + '</b> δεν μπήκαν (το τηλέφωνο και το email είναι σε διαφορετικές επαφές)');
    var txt = parts.length ? parts.join('<br>') : 'Όλα ήταν ήδη στο κινητό σου.';
    if (r.more) txt += '<br><span class="mut">Άλλες ' + r.more + ' θα μπουν το επόμενο βράδυ.</span>';
    return '<p>' + txt + '</p>';
  }

  function when(ts) { return ts ? new Date(ts).toLocaleString('el-GR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : ''; }

  function render(res) {
    if (!ST.linked && CODE) {
      el.innerHTML =
        '<h1>Επαφές κινητού</h1>' +
        '<p>Κάθε βράδυ, οι νέοι πελάτες σου θα μπαίνουν μόνοι τους στις επαφές σου, στην ομάδα του ακινήτου.</p>' +
        '<div class="card"><b>Τι θα βλέπεις όταν σε παίρνουν</b><p>«Μαρία Παπαδάκη · 4411 Βαρίκα 13» αντί για άγνωστο αριθμό.</p>' +
        '<p class="mut">Δεν σβήνεται και δεν αλλάζει καμία επαφή σου. Αν ο πελάτης υπάρχει ήδη, απλώς μπαίνει στην ομάδα.</p></div>' +
        (ST.email ? '<p class="mut">Λογαριασμός: ' + esc(ST.email) + '</p>' : '') +
        '<button class="main" id="go">Σύνδεση</button>' + (res ? resText(res) : '');
      document.getElementById('go').onclick = function () { run('pair', CODE, this); };
      return;
    }
    if (!ST.linked) {
      el.innerHTML = '<h1>Επαφές κινητού</h1><p>Άνοιξε τη σύνδεση από την εφαρμογή: Επαφές → Επαφές κινητού → «Σύνδεση».</p>' + (res ? resText(res) : '');
      return;
    }
    var last = ST.last;
    el.innerHTML =
      '<div class="big ok">✓</div><h1>Είσαι συνδεδεμένος</h1>' +
      '<p>Κάθε βράδυ μετά τις 20:00 οι νέοι πελάτες μπαίνουν στις επαφές σου. Δεν χρειάζεται να κάνεις τίποτα.</p>' +
      (res ? '<div class="card"><b>Μόλις τώρα</b>' + resText(res) + '</div>'
        : last ? '<div class="card"><b>Τελευταία φορά · ' + esc(when(last.at)) + '</b>' + resText(last) + '</div>' : '') +
      '<div class="card"><b>Στο iPhone</b><ol>' +
        '<li>Ρυθμίσεις → Επαφές → Λογαριασμοί → ο λογαριασμός Google σου → άνοιξε το «Επαφές».</li>' +
        '<li>Ρυθμίσεις → Επαφές → Προεπιλεγμένος λογαριασμός → ο λογαριασμός Google σου.</li></ol>' +
        '<p class="mut">Έτσι οι επαφές φαίνονται στο κινητό και δεν γίνονται διπλές.</p></div>' +
      '<p class="mut">Μπορείς να κλείσεις αυτή τη σελίδα και να γυρίσεις στην εφαρμογή.</p>' +
      '<button class="ghost" id="now">Συγχρονισμός τώρα</button>' +
      '<button class="link" id="off">Αποσύνδεση</button>';
    document.getElementById('now').onclick = function () { run('syncNow', null, this); };
    document.getElementById('off').onclick = function () {
      if (confirm('Οι νέοι πελάτες δεν θα μπαίνουν πια στις επαφές σου. Όσες μπήκαν ήδη μένουν.')) run('unlink', null, this);
    };
  }

  function run(fn, arg, btn) {
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = 'Περίμενε λίγο…';
    var r = google.script.run.withSuccessHandler(function (out) {
      ST = out.state; CODE = ''; render(out.res);
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = old;
      render({ error: e && e.message ? e.message : String(e) });
    });
    if (arg == null) r[fn](); else r[fn](arg);
  }

  render(null);
</script>
</body>
</html>
